site_name: OPNsense provider for OpenTofu and Terraform
site_description: Manage OPNsense firewalls as code — firewall, VPNs, DHCP, DNS, HAProxy, Caddy, ACME and more.
site_url: https://mathieuha.github.io/terraform-provider-opnsense/
repo_url: https://github.com/mathieuHa/terraform-provider-opnsense
repo_name: mathieuHa/terraform-provider-opnsense
edit_uri: ""
copyright: Provider licensed under the MPL-2.0. OPNsense® is a registered trademark of Deciso B.V.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
