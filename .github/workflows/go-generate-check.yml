name: Go Generate Check

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/**'

permissions:
  contents: read

jobs:
  check-go-generate:
    name: Ensure go generate is up to date
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "⚠️ 'go generate' resulted in changes. Please run 'go generate ./...' and commit the results."
            git diff
            exit 1
          fi
